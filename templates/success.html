<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успешно | Музей Вычислительной Техники</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --dark-bg: #0a0a0a; --panel-bg: #161616; --accent: #c5a059; }
        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background: radial-gradient(circle at center, #1b1b1b 0%, #0a0a0a 100%);
        }
        .success-card {
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 40px;
            padding: 60px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .icon-box {
            width: 80px; height: 80px;
            border: 3px solid var(--accent);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 30px;
            color: var(--accent); font-size: 2.5rem;
        }
        h1 { font-weight: 800; margin-bottom: 15px; }
        p { color: #a0a0a0; margin-bottom: 40px; }
        .btn-continue {
            display: inline-block; background: var(--accent); color: #000;
            text-decoration: none; padding: 15px 40px; border-radius: 12px;
            font-weight: 700; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-box">✓</div>
        <h1>Доступ разрешен</h1>
        <p>Инициализация сессии завершена успешно. Добро пожаловать в цифровую сокровищницу.</p>
        <a href="/" class="btn-continue">Войти в музей</a>
    </div>
</body>
</html>
