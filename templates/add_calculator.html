<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить экспонат | CalcMuseum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #0a0a0a;
            --panel-bg: #161616;
            --accent: #c5a059;
            --text-light: #eeeeee;
        }
        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Segoe UI', sans-serif;
            padding-bottom: 50px;
        }
        .form-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .form-control, .form-select {
            background-color: #0f0f0f;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #121212;
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
        }
        .btn-accent {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-accent:hover {
            background-color: #b38f4b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <a href="{{ url_for('index') }}" class="text-decoration-none style mb-4 d-inline-block" style="color: var(--accent);">&larr; На главную</a>
            
            <h2 class="mb-4" style="color: var(--accent);">Добавление нового калькулятора</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} bg-dark border-{{ category }} text-light">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('add_calculator') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label">Название калькулятора</label>
                    <input type="text" class="form-control" id="title" name="title" required placeholder="Например: Арифмометр Феликс">
                </div>

                <div class="mb-3">
                    <label for="short_description" class="form-label">Краткое описание</label>
                    <input type="text" class="form-control" id="short_description" name="short_description" required placeholder="Будет отображаться на главной странице">
                </div>

                <div class="mb-3">
                    <label for="full_description" class="form-label">Полная история / Описание</label>
                    <textarea class="form-control" id="full_description" name="full_description" rows="5" required placeholder="Подробный текст об экспонате..."></textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="creation_year" class="form-label">Год создания</label>
                        <input type="number" class="form-control" id="creation_year" name="creation_year" required placeholder="Например: 1970">
                    </div>
                    <div class="col-md-6">
                        <label for="simulator_type" class="form-label">Тип симулятора</label>
                        <select class="form-select" id="simulator_type" name="simulator_type">
                            <option value="none">Без симулятора</option>
                            <option value="abacus">Абак</option>
                            <option value="pascalina">Паскалина</option>
                            <option value="arithmometer">Арифмометр</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="image" class="form-label">Изображение экспоната</label>
                    <input class="form-control" type="file" id="image" name="image" accept="image/*" required>
                </div>

                <button type="submit" class="btn btn-accent w-100 py-3">Опубликовать в музее</button>
            </form>
        </div>
    </div>
</body>
</html>
